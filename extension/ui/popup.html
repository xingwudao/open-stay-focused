<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Stay Focused</title><link rel="stylesheet" href="styles.css"><script type="module" src="popup.js"></script></head><body class="popup"><a class="brand" href="options.html" target="_blank"><img src="../icons/48.png" width="28" height="28" alt="">Open Stay Focused</a><h1>A moment of intention.</h1><p id="site" class="eyebrow">CURRENT WEBSITE</p><div id="remaining" class="big-time">—</div><p id="host-usage"></p><p id="reason" class="hint"></p><div id="error" role="alert" class="notice error" hidden></div><div id="status" role="status" class="notice" hidden></div><label>Add this website to<select id="target-group"></select></label><div class="actions"><button id="quick-add">Add website</button><button id="open-settings" class="secondary">Settings</button></div><div class="actions"><button id="quick-allow" class="secondary" hidden>Allow this website</button><button id="pause" class="secondary" hidden>Pause restrictions</button></div><p class="hint">Local budgets. No account. Your rules.</p><p id="version" class="hint"></p><dialog id="challenge-dialog"><h2>A deliberate change</h2><p>Wrong characters, deletion, paste or drop restart the challenge. Chinese input composition is supported.</p><p id="challenge-phrase"></p><label>Type the sentence exactly<textarea id="challenge-input" rows="4"></textarea></label><p id="challenge-error" role="alert" class="error-text"></p><div class="actions"><button id="challenge-confirm">Confirm change</button><button id="challenge-cancel" class="secondary">Cancel</button></div></dialog></body></html>
